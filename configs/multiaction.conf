[BreakChi2]
IsEnabled: true
Chi2Thresh: 1.05
MinXRange: 15
LengthXToBreak:10
FixMaxAngle: 10
FixMinXRange: 90
FixChi2Diff: 1.05
% size of cylinder
BeamWindowY: 2
BeamWindowZ: 3
BreakLengthThresh: 3
DoClusterNotBeam: true
DoBreakMultiTracks: false
TrackChi2Thresh: 2.5
BeamWindowScale: 2

[Merge]
IsEnabled: true
DistThresh: 5
%% minimum cos of angle for tracks to be considered parallel
MinParallelFactor: 0.9
%% chi2_3 <= chi2factor * max(chi2_1, chi2_2) 
Chi2Factor: 1.5

%% cant use this function cause L1 events have different Z
%[CleanPileUp]
%IsEnabled: false
%XPercent: 0.2
%LowerZ: 210
%UpperZ: 330

[CleanDeltas]
IsEnabled: true
UseExtVoxels: true
Chi2Thresh: 2.5
% max n of voxels to be considered noise
MaxVoxels: 13
% cylinder that tries to delete anomalies for wide beam tracks.
UseCylinder: false
SigmaGap: 2.1
CylinderR: 1.75

% cleans the vertical columns on the Z axis from saturated pads
[CleanZs]
IsEnabled: true
ZDirectionThreshold: 0.9
MaxSpanInPlane: 8

[CleanBadFits]
IsEnabled: true

%[User]
%Name: libUserAction.so
%Path: /configs/user/build/
%
%[UserConfig]
%IsEnabled: false
%MaxAngle: 5
%MinLength: 40
%CylinderR: 2.5
%

[FindRP]
IsEnabled: true
UseExtVoxels: true
BeamLikeMaxAngle: 7 
BeamLikeXMinThresh: 60
BeamLikeMinVoxels: 15
% Max distance between two lines to form a RP
RPDistThresh: 5.7
% max distance to cluster RPs
RPDistCluster: 10
RPDistToggleSort: 17
EnableDeleteInvalidCluster: true
%% More detailed treatment
EnableFineRP: true
% to keep the recoil separated after finding RP
KeepBreakBeam: true
% min distance in x after RP to assume beam is a recoil
MinXSepBreakBeam: 7
% min n of voxels for new cluster after RP
MinVoxelsBreakBeam: 2
% IF RP is found before RPDefaultMinX then the beam direction is set to 1,0,0
EnableRPDefaultBeam: true
RPDefaultMinX: 10
% FixBreakBeam connects the tracks of the recoil and whatever remained from the beam after separating asfter the RP
EnableFixBreakBeam: true
MaxVoxelsFixBreak: 95
MinPercentFixBreak: 0.825
EnableCylinder: false
CylinderR: 3
RPMaskXY: 0
RPMaskZ: 0
RPPivotDist: 0
